name: G1 authorization regression

on:
  pull_request:
  push:
    branches: [master, develop]

jobs:
  g1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --no-scripts --prefer-dist
      - run: cp .env.testing.example .env
      - name: Run isolated G1 checks
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          LOG_CHANNEL: stderr
        run: php vendor/bin/phpunit tests/Feature/GovStore/G1AuthorizationTest.php
