        }
        & .modal-content { border-radius: var(--gs-radius-lg) !important; box-shadow: var(--gs-shadow-2) !important; }
        & .modal-backdrop.in { background-color: var(--gs-color-overlay) !important; opacity: 1 !important; }
        & .modal-danger .modal-header { background-color: var(--gs-color-danger) !important; color: var(--gs-color-on-danger) !important; }
        & .modal-danger .modal-header h2, & .modal-danger .modal-header h4 { color: var(--gs-color-on-danger) !important; }
        & .popover, & .popover-content, & .popover-title,
        & .popover.help-popover, & .popover.help-popover .popover-content, & .popover.help-popover .popover-title {
            background-color: var(--gs-color-surface-raised) !important;
            color: var(--gs-color-text) !important;
            border-color: var(--gs-color-border) !important;
        }
        & .popover.right .arrow, & .popover.right .arrow::after { border-right-color: var(--gs-color-surface-raised) !important; }
        & .tooltip-inner { background-color: var(--gs-color-text) !important; color: var(--gs-color-text-inverse) !important; }

        /* ---------- dashboard info / small boxes ---------- */
        & .info-box { border-radius: var(--gs-radius-md) !important; box-shadow: var(--gs-surface-shadow, var(--gs-shadow-1)) !important; }
        & .info-box-text, & .info-box-number { color: var(--gs-color-text) !important; }
        & .small-box { border-radius: var(--gs-radius-md) !important; }
        & .small-box h3, & .small-box p, & .small-box .small-box-footer, & .small-box .icon { color: var(--gs-small-box-fg, var(--gs-color-on-primary)) !important; }
        /* --gs-small-box-tone carries the fill colour so surface variants (elevated) can reuse it as an accent. */
        & .bg-teal, & .small-box.bg-teal { background-color: var(--gs-chart-5) !important; --gs-small-box-tone: var(--gs-chart-5); }
        & .bg-aqua, & .small-box.bg-aqua, & .bg-blue { background-color: var(--gs-color-info) !important; --gs-small-box-fg: var(--gs-color-on-info); --gs-small-box-tone: var(--gs-color-info); }
        & .bg-green, & .small-box.bg-green { background-color: var(--gs-color-success) !important; --gs-small-box-fg: var(--gs-color-on-success); --gs-small-box-tone: var(--gs-color-success); }
        & .bg-yellow, & .bg-orange, & .small-box.bg-yellow, & .small-box.bg-orange { background-color: var(--gs-color-warning) !important; --gs-small-box-fg: var(--gs-color-on-warning); --gs-small-box-tone: var(--gs-color-warning); }
        & .bg-red, & .small-box.bg-red { background-color: var(--gs-color-danger) !important; --gs-small-box-fg: var(--gs-color-on-danger); --gs-small-box-tone: var(--gs-color-danger); }
        & .bg-maroon, & .bg-purple, & .small-box.bg-maroon, & .small-box.bg-purple { background-color: var(--gs-color-primary) !important; --gs-small-box-fg: var(--gs-color-on-primary); --gs-small-box-tone: var(--gs-color-primary); }

        /* ---------- footer ---------- */
        & footer.main-footer {
            background-color: var(--gs-footer-bg) !important;
            color: var(--gs-footer-fg) !important;
            border-top: var(--gs-border-width) solid var(--gs-color-border) !important;
        }
        & .footer-links a, & footer.main-footer a { color: var(--gs-color-link) !important; }

        /* ---------- login (layouts/basic) ---------- */
        &:is(body.login-page), & body.login-page { background-color: var(--gs-color-bg) !important; }
        & .login-box-body,
        & .login-page .box {
            background-color: var(--gs-color-surface) !important;
            color: var(--gs-color-text) !important;
            border-radius: var(--gs-radius-lg) !important;
            box-shadow: var(--gs-shadow-2) !important;
        }

        /* ---------- misc ---------- */
        & hr { border-top-color: var(--gs-color-border) !important; }
        & .progress { background-color: var(--gs-color-surface-sunken) !important; }
        & .progress-bar { background-color: var(--gs-color-primary) !important; }
        & .chart-responsive { color: var(--gs-color-text) !important; }
        & .table-display dt, & .table-display dd, & .main-panel-content { border-top-color: var(--gs-color-border) !important; }
    }

    /* Print: never a dark page, whatever the screen mode. */
    @media print {
        [data-skin]:not([data-skin="default"]) body,
        [data-skin]:not([data-skin="default"]) .content-wrapper,
        [data-skin]:not([data-skin="default"]) .box {
            background: var(--gs-color-surface) !important;
            color: var(--gs-color-text) !important;
            box-shadow: none !important;
        }
    }
}

/* adapter/variants.css */
/*
 * Layer 3 — layout variants, implemented once. Themes only choose values in theme.json;
 * the layout hook writes them to <html> as data-gs-* attributes (Lab panels carry them too).
 *
 * Part A (unlayered): variant → token values. Custom properties take part in cascade layers,
 * so token overrides must be unlayered to beat the generated theme blocks; [data-skin][data-gs-*]
 * (0,2,0) beats the theme's [data-skin="…"] (0,1,0) block.
 */

/* ---- density ---- */
[data-skin][data-gs-density="compact"] { --gs-size-row-h: 32px; --gs-size-control-h: 30px; --gs-box-pad: 8px; --gs-cell-pad-y: 5px; }
[data-skin][data-gs-density="regular"] { --gs-size-row-h: 38px; --gs-size-control-h: 34px; --gs-box-pad: 10px; --gs-cell-pad-y: 8px; }
[data-skin][data-gs-density="comfortable"] { --gs-size-row-h: 44px; --gs-size-control-h: 38px; --gs-box-pad: 16px; --gs-cell-pad-y: 12px; }
@media (pointer: coarse) {
    /* Touch targets stay at least 44px whatever the density. */
    [data-skin][data-gs-density] { --gs-size-row-h: max(44px, var(--gs-size-row-h)); --gs-size-control-h: 44px; }
}

/* ---- radius ---- */
[data-skin][data-gs-radius="none"] { --gs-radius-sm: 0; --gs-radius-md: 0; --gs-radius-lg: 0; }
[data-skin][data-gs-radius="sm"] { --gs-radius-sm: 2px; --gs-radius-md: 3px; --gs-radius-lg: 4px; }
[data-skin][data-gs-radius="md"] { --gs-radius-sm: 4px; --gs-radius-md: 6px; --gs-radius-lg: 8px; }
[data-skin][data-gs-radius="lg"] { --gs-radius-sm: 6px; --gs-radius-md: 10px; --gs-radius-lg: 14px; }

/* ---- type ---- */
[data-skin][data-gs-type="sans"] { --gs-font-display: var(--gs-font-sans); }

/* ---- surfaces ---- */
[data-skin][data-gs-surfaces="card"] { --gs-surface-shadow: var(--gs-shadow-1); }
[data-skin][data-gs-surfaces="flat"] { --gs-surface-shadow: none; }
[data-skin][data-gs-surfaces="elevated"] { --gs-surface-shadow: var(--gs-shadow-1); }

/* ---- controls ---- */
[data-skin][data-gs-controls="outlined"] { --gs-control-bg: var(--gs-color-surface); }
/* Filled fields keep the strong border: a fill alone is too faint to mark a field (WCAG 1.4.11). */
[data-skin][data-gs-controls="filled"] { --gs-control-bg: var(--gs-color-surface-sunken); }

/* ---- table ---- */
[data-skin][data-gs-table="grid"] { --gs-table-stripe: var(--gs-table-row-alt); --gs-table-cell-rule: var(--gs-border-width) solid var(--gs-table-border); }
[data-skin][data-gs-table="rules"] { --gs-table-stripe: var(--gs-color-surface); --gs-table-cell-rule: 0; }
[data-skin][data-gs-table="ledger"] { --gs-table-stripe: var(--gs-color-surface); --gs-table-cell-rule: 0; }

/* ---- header (shell tokens read by the adapter) ---- */
[data-skin][data-gs-header="brand"],
[data-skin][data-gs-header="dark"] {
    --gs-shell-header-bg: var(--gs-header-bg);
    --gs-shell-header-fg: var(--gs-header-fg);
    --gs-shell-header-fg-muted: var(--gs-header-fg-muted);
    --gs-shell-header-hover: color-mix(in oklab, var(--gs-header-fg) 14%, transparent);
    --gs-shell-header-input-bg: color-mix(in oklab, var(--gs-header-fg) 14%, transparent);
}
/* floating: the header tokens on a rounded, shadowed card inset from the page edges */
[data-skin][data-gs-header="floating"] {
    --gs-shell-header-bg: var(--gs-header-bg);
    --gs-shell-header-fg: var(--gs-header-fg);
    --gs-shell-header-fg-muted: var(--gs-header-fg-muted);
    --gs-shell-header-hover: color-mix(in oklab, var(--gs-header-fg) 8%, transparent);
    --gs-shell-header-input-bg: color-mix(in oklab, var(--gs-header-fg) 6%, var(--gs-header-bg));
    --gs-shell-header-inset: var(--gs-space-2);
}
[data-skin][data-gs-header="neutral"] {
    --gs-shell-header-bg: var(--gs-color-surface);
    --gs-shell-header-fg: var(--gs-color-text);
    --gs-shell-header-fg-muted: var(--gs-color-text-muted);
    --gs-shell-header-hover: var(--gs-color-surface-sunken);
    --gs-shell-header-input-bg: var(--gs-color-surface-sunken);
}

/* ---- sidebar (shell tokens read by the adapter) ---- */
[data-skin][data-gs-sidebar="dark"],
[data-skin][data-gs-sidebar="light"] {
    --gs-shell-sidebar-bg: var(--gs-sidebar-bg);
    --gs-shell-sidebar-fg: var(--gs-sidebar-fg);
    --gs-shell-sidebar-section-fg: var(--gs-sidebar-section-fg);
    --gs-shell-sidebar-active-bg: var(--gs-sidebar-active-bg);
    --gs-shell-sidebar-active-fg: var(--gs-sidebar-active-fg);
    --gs-shell-sidebar-hover: color-mix(in oklab, var(--gs-sidebar-fg) 10%, transparent);
    --gs-shell-sidebar-rule: 0;
}
[data-skin][data-gs-sidebar="light"] { --gs-shell-sidebar-rule: var(--gs-border-width) solid var(--gs-color-border); }
[data-skin][data-gs-sidebar="brand"] {
    --gs-shell-sidebar-bg: var(--gs-color-primary);
    --gs-shell-sidebar-fg: var(--gs-color-on-primary);
    --gs-shell-sidebar-section-fg: color-mix(in oklab, var(--gs-color-on-primary) 70%, transparent);
    --gs-shell-sidebar-active-bg: var(--gs-color-primary-active);
    --gs-shell-sidebar-active-fg: var(--gs-color-on-primary);
    --gs-shell-sidebar-hover: color-mix(in oklab, var(--gs-color-on-primary) 12%, transparent);
    --gs-shell-sidebar-rule: 0;
}

/*
 * Part B (@layer gs-adapter): selector effects on Snipe-IT's shell and tables.
 * Snipe-IT Classic keeps the stock layout, so these apply to designed themes only.
 */
@layer gs-adapter {
    [data-skin]:not([data-skin="default"]) {
        /* header */
        &[data-gs-header="dark"] .main-header .navbar { box-shadow: inset 0 -2px 0 var(--gs-sidebar-active-marker) !important; }
        &[data-gs-header="neutral"] .main-header .navbar,
        &[data-gs-header="neutral"] .main-header .logo { border-bottom: var(--gs-border-width) solid var(--gs-color-border) !important; }

        /* floating header: inset card; the sidebar starts below it */
        &[data-gs-header="floating"] .main-header {
            background-color: var(--gs-color-bg) !important;
            padding: var(--gs-shell-header-inset) var(--gs-shell-header-inset) 0 !important;
        }
        &[data-gs-header="floating"] .main-header .navbar {
            border-radius: var(--gs-radius-lg) !important;
            box-shadow: var(--gs-shadow-1) !important;
        }
        /* The insets cost width; tighter item padding keeps the stock one-row header with the sidebar open. */
        &[data-gs-header="floating"] .main-header .navbar-custom-menu .navbar-nav > li > a { padding-left: 10px !important; padding-right: 10px !important; }
        /* Snipe-IT's navbar is ~64px (two-line user block) while AdminLTE pads the sidebar by 50px, so the
           first item sits under the header in stock too; with pill items that clip shows, so clear it here. */
        &[data-gs-header="floating"] .main-sidebar,
        &[data-gs-header="floating"] .left-side { padding-top: calc(64px + var(--gs-shell-header-inset)) !important; }

        /* nav style: pill — rounded, inset items, no left marker (collapsed mini mode keeps the stock shape) */
        &[data-gs-nav-style="pill"] .sidebar-menu > li:hover,
        &[data-gs-nav-style="pill"] .treeview-menu > li:hover { background-color: transparent !important; }
        &[data-gs-nav-style="pill"] .sidebar-menu > li.active > a,
        &[data-gs-nav-style="pill"] .treeview-menu > li.active > a { border-left: 0 !important; }
        &[data-gs-nav-style="pill"] body:not(.sidebar-collapse) .sidebar-menu > li > a,
        &[data-gs-nav-style="pill"] body:not(.sidebar-collapse) .treeview-menu > li > a {
            margin: 2px var(--gs-space-2) !important;
            border-radius: var(--gs-radius-md) !important;
            border-left: 0 !important;
        }
        /* Sub-items: indented pills, tighter padding so labels and count badges keep their width. */
        &[data-gs-nav-style="pill"] body:not(.sidebar-collapse) .treeview-menu > li > a {
            margin: 1px var(--gs-space-2) 1px var(--gs-space-3) !important;
            padding-left: var(--gs-space-2) !important;
        }
        &[data-gs-nav-style="pill"] body:not(.sidebar-collapse) .sidebar-menu > li.header { padding-left: var(--gs-space-4) !important; }

        /* controls: field fill (outlined = surface, filled = sunken) */
        & :is(input[type="date"], input[type="number"], input[type="text"], input[type="url"], input[type="email"],
              input[type="password"], input[type="tel"], input[type="search"], select, textarea, .form-control,
              .select2-selection):not(:disabled):not([readonly]) {
            background-color: var(--gs-control-bg, var(--gs-color-surface)) !important;
        }
        &[data-gs-controls="filled"] :is(.form-control, .select2-selection, select, textarea) { border-radius: var(--gs-radius-md) !important; }
        &[data-gs-controls="filled"] .main-header #tagSearch { background-color: var(--gs-shell-header-input-bg) !important; }

        /* sidebar: text-only first level (collapsed mini mode always keeps icons) */
        &[data-gs-nav-icons="hidden"] body:not(.sidebar-collapse) .sidebar-menu > li > a > i:first-child,
        &[data-gs-nav-icons="hidden"] body:not(.sidebar-collapse) .sidebar-menu > li > a > .fa:first-child,
        &[data-gs-nav-icons="hidden"] body:not(.sidebar-collapse) .sidebar-menu > li > a > .fas:first-child { display: none !important; }

        /* density */
        & .box-body, & .box-header, & .box-footer, & .panel-body { padding: var(--gs-box-pad) calc(var(--gs-box-pad) + 4px) !important; }
        & .table > thead > tr > th,
        & .table > tbody > tr > td,
        & .table > tbody > tr > th,
        & .table > tfoot > tr > td {
            padding-top: var(--gs-cell-pad-y) !important;
            padding-bottom: var(--gs-cell-pad-y) !important;
            height: var(--gs-size-row-h) !important;
            vertical-align: middle !important;
        }

        /* table styles */
        &[data-gs-table="grid"] .table > thead > tr > th,
        &[data-gs-table="grid"] .table > tbody > tr > td {
            border-left: var(--gs-table-cell-rule) !important;
        }
        &[data-gs-table="grid"] .table > thead > tr > th:first-child,
        &[data-gs-table="grid"] .table > tbody > tr > td:first-child { border-left: 0 !important; }
        &[data-gs-table="ledger"] .table > thead > tr > th {
            text-transform: uppercase !important;
            font-size: var(--gs-font-size-sm) !important;
            letter-spacing: 0.06em !important;
            font-weight: 600 !important;
            border-bottom: 2px solid var(--gs-table-total-rule) !important;
        }
        &[data-gs-table="ledger"] .table > tfoot > tr:first-child > td,
        &[data-gs-table="ledger"] .table > tfoot > tr:first-child > th {
            border-top: 3px double var(--gs-table-total-rule) !important;
            font-weight: 600 !important;
        }
        &[data-gs-table="ledger"] .table > tbody > tr > td { font-variant-numeric: tabular-nums !important; }

        /* surfaces */
        &[data-gs-surfaces="flat"] .box,
        &[data-gs-surfaces="flat"] .info-box,
        &[data-gs-surfaces="flat"] .nav-tabs-custom,
        &[data-gs-surfaces="flat"] .panel {
            background-color: transparent !important;
            border: 0 !important;
            border-top: var(--gs-border-width) solid var(--gs-color-border) !important;
            box-shadow: none !important;
            border-radius: 0 !important;
        }
        &[data-gs-surfaces="flat"] .box-header.with-border { background: transparent !important; }
        &[data-gs-surfaces="flat"] .content { padding-top: var(--gs-space-5) !important; }

        &[data-gs-surfaces="elevated"] .box,
        &[data-gs-surfaces="elevated"] .info-box,
        &[data-gs-surfaces="elevated"] .nav-tabs-custom,
        &[data-gs-surfaces="elevated"] .panel {
            border: 0 !important;
            border-radius: var(--gs-radius-lg) !important;
            box-shadow: var(--gs-surface-shadow) !important;
        }
        &[data-gs-surfaces="elevated"] .box-header.with-border { border-bottom-color: transparent !important; }
        /* Dashboard small boxes become white metric cards: tone figure, faded tone icon, tinted footer link. */
        &[data-gs-surfaces="elevated"] .small-box[class] {
            background-color: var(--gs-color-surface) !important;
            border-radius: var(--gs-radius-lg) !important;
            box-shadow: var(--gs-surface-shadow) !important;
            overflow: hidden !important;
        }
        &[data-gs-surfaces="elevated"] .small-box h3 { color: var(--gs-small-box-tone, var(--gs-color-primary)) !important; font-weight: 500 !important; }
        &[data-gs-surfaces="elevated"] .small-box p { color: var(--gs-color-text-muted) !important; }
        &[data-gs-surfaces="elevated"] .small-box .icon { color: var(--gs-small-box-tone, var(--gs-color-primary)) !important; opacity: .22 !important; }
        &[data-gs-surfaces="elevated"] .small-box .small-box-footer {
            background-color: color-mix(in oklab, var(--gs-small-box-tone, var(--gs-color-primary)) 10%, var(--gs-color-surface)) !important;
            color: var(--gs-color-text) !important;
        }
        &[data-gs-surfaces="elevated"] .box-header .box-title { font-size: 1.15em !important; }
        &[data-gs-surfaces="elevated"] .content-header {
            margin: 0 var(--gs-space-4) var(--gs-space-4) !important;
            padding: var(--gs-space-4) 0 var(--gs-space-3) !important;
            border-bottom: var(--gs-border-width) solid var(--gs-color-border) !important;
        }
        &[data-gs-surfaces="elevated"] .content-header::after { content: "" !important; display: table !important; clear: both !important; }
        &[data-gs-surfaces="elevated"] :is(.btn-primary, .btn-theme):hover {
            box-shadow: 0 8px 25px -8px var(--gs-color-primary) !important;
        }

        /* display type */
        &[data-gs-type="serif-display"] .content-header > h1,
        &[data-gs-type="serif-display"] .box-title,
        &[data-gs-type="serif-display"] .info-box-number,
        &[data-gs-type="serif-display"] .small-box h3 {
            font-family: var(--gs-font-display) !important;
            letter-spacing: -0.01em !important;
        }
    }
}

/* 10-kit.css */
/*
 * UI kit (@layer gs-components). Only .gs-* classes and --gs-* tokens. Components follow the
 * data-gs-* variants automatically; callers never pass theme decisions.
 * `!important` is used only where Snipe-IT styles bare elements (h1–h4, p, th, td, a) with
 * unlayered or !important rules that would otherwise leak into kit markup.
 */
@layer gs-components {

    /* ---------- shared ---------- */
    .gs-bn { font-family: var(--gs-font-bengali) !important; }
    .gs-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
    .gs-muted { color: var(--gs-color-text-muted) !important; }
    .gs-num { font-variant-numeric: tabular-nums; text-align: right; }
    .gs-focusable:focus-visible,
    .gs-btn:focus-visible,
    .gs-tabs__link:focus-visible,
    .gs-kpi--link:focus-visible {
        outline: 2px solid var(--gs-color-focus-ring) !important;
        outline-offset: 2px;
    }

    .gs-btn {
        display: inline-flex; align-items: center; gap: var(--gs-space-2);
        min-height: var(--gs-size-control-h);
        padding: 0 var(--gs-space-4);
        border: var(--gs-border-width) solid var(--gs-color-border-strong);
        border-radius: var(--gs-radius-sm);
        background: var(--gs-color-surface);
        color: var(--gs-color-text) !important;
        font: inherit; font-weight: 500; text-decoration: none !important; cursor: pointer;
    }
    .gs-btn:hover { background: var(--gs-color-surface-sunken); }
    .gs-btn--primary { background: var(--gs-color-primary); border-color: var(--gs-color-primary); color: var(--gs-color-on-primary) !important; }
    .gs-btn--primary:hover { background: var(--gs-color-primary-hover); }
    .gs-btn--danger { background: var(--gs-color-danger); border-color: var(--gs-color-danger); color: var(--gs-color-on-danger) !important; }
    .gs-btn--ghost { background: transparent; border-color: transparent; }

    /* ---------- page header ---------- */
    .gs-page-header {
        display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--gs-space-3);
        padding: var(--gs-space-4) 0 var(--gs-space-3);
        margin-bottom: var(--gs-space-4);
        border-bottom: var(--gs-border-width) solid var(--gs-color-border);
    }
    [data-gs-surfaces="card"] .gs-page-header { border-bottom-color: transparent; }
    .gs-page-header__title {
        margin: 0 !important;
        font-family: var(--gs-font-display) !important;
        font-size: 1.6em !important;
        font-weight: var(--gs-font-heading-weight) !important;
        color: var(--gs-color-text) !important;
        overflow-wrap: anywhere;
    }
    .gs-page-header__bn { display: block; font-size: 0.6em; color: var(--gs-color-text-muted) !important; font-family: var(--gs-font-bengali) !important; font-weight: 400; }
    .gs-page-header__subtitle { margin: var(--gs-space-1) 0 0 !important; color: var(--gs-color-text-muted) !important; }
    .gs-page-header__meta { display: flex; flex-wrap: wrap; gap: var(--gs-space-3); margin-top: var(--gs-space-2); color: var(--gs-color-text-muted); font-size: var(--gs-font-size-sm); }
    .gs-page-header__actions { display: flex; flex-wrap: wrap; gap: var(--gs-space-2); }

    /* ---------- box ---------- */
    .gs-box {
        background: var(--gs-color-surface);
        color: var(--gs-color-text);
        border: var(--gs-border-width) solid var(--gs-color-border);
        border-radius: var(--gs-radius-md);
        box-shadow: var(--gs-surface-shadow, none);
        margin-bottom: var(--gs-space-4);
    }
    .gs-box--primary { border-top: 3px solid var(--gs-color-primary); }
    .gs-box--muted { background: var(--gs-color-surface-sunken); }
    [data-gs-surfaces="flat"] .gs-box { background: transparent; border: 0; border-top: var(--gs-border-width) solid var(--gs-color-border); border-radius: 0; box-shadow: none; }
    [data-gs-surfaces="flat"] .gs-box--primary { border-top: 2px solid var(--gs-color-primary); }
    .gs-box__header { display: flex; align-items: center; gap: var(--gs-space-2); padding: var(--gs-box-pad, 10px) calc(var(--gs-box-pad, 10px) + 4px); border-bottom: var(--gs-border-width) solid var(--gs-color-border); }
    [data-gs-surfaces="flat"] .gs-box__header { padding-left: 0; padding-right: 0; }
    .gs-box__title { margin: 0 !important; flex: 1; font-size: 1.1em !important; font-family: var(--gs-font-display) !important; font-weight: var(--gs-font-heading-weight) !important; color: var(--gs-color-text) !important; }
    .gs-box__tools { display: flex; gap: var(--gs-space-2); }
    .gs-box__body { padding: var(--gs-box-pad, 10px) calc(var(--gs-box-pad, 10px) + 4px); }
    [data-gs-surfaces="flat"] .gs-box__body { padding-left: 0; padding-right: 0; }
    .gs-box__footer { padding: var(--gs-space-2) calc(var(--gs-box-pad, 10px) + 4px); border-top: var(--gs-border-width) solid var(--gs-color-border); color: var(--gs-color-text-muted); }
    .gs-box[data-collapsed="true"] .gs-box__body,
    .gs-box[data-collapsed="true"] .gs-box__footer { display: none; }
    .gs-box__toggle { background: none; border: 0; color: var(--gs-color-text-muted); cursor: pointer; padding: var(--gs-space-1); }
    .gs-box--loading .gs-box__body { opacity: 0.5; pointer-events: none; }

    /* ---------- table ---------- */
    .gs-table-wrap { overflow-x: auto; border-radius: var(--gs-radius-md); }
    .gs-table-wrap--sticky { max-height: 70vh; overflow-y: auto; }
    .gs-table { width: 100%; border-collapse: separate; border-spacing: 0; color: var(--gs-color-text); font-size: var(--gs-font-size-base); }
    .gs-table caption { caption-side: top; text-align: left; padding: var(--gs-space-2) 0; color: var(--gs-color-text-muted) !important; }
    .gs-table th,
    .gs-table td {
        height: var(--gs-size-row-h);
        padding: var(--gs-cell-pad-y, 6px) var(--gs-space-3) !important;
        border-top: 0 !important;
        border-bottom: var(--gs-border-width) solid var(--gs-table-border) !important;
        vertical-align: middle;
        color: var(--gs-color-text) !important;
        background: transparent;
    }
    .gs-table thead th {
        background: var(--gs-table-head-bg) !important;
        color: var(--gs-table-head-fg) !important;
        font-weight: 600; text-align: left; white-space: nowrap;
    }
    .gs-table-wrap--sticky thead th { position: sticky; top: 0; z-index: 1; }
    .gs-table tbody tr:hover > td { background: var(--gs-table-row-hover) !important; }
    .gs-table tbody tr[aria-selected="true"] > td,
    .gs-table tbody tr.selected > td { background: var(--gs-table-row-selected) !important; }
    .gs-table tfoot td, .gs-table tfoot th { font-weight: 600; background: var(--gs-color-surface) !important; }
    /* Table style follows data-gs-table; an explicit data-table on the component overrides it locally. */
    :is([data-gs-table="grid"] .gs-table:not([data-table]), .gs-table[data-table="grid"]) {
        border: var(--gs-border-width) solid var(--gs-table-border); border-radius: var(--gs-radius-md);
        & tbody tr:nth-child(even) > td { background: var(--gs-table-row-alt); }
        & th + th, & td + td { border-left: var(--gs-border-width) solid var(--gs-table-border) !important; }
    }
    :is([data-gs-table="rules"] .gs-table:not([data-table]), .gs-table[data-table="rules"]) {
        & thead th { border-bottom-width: 2px !important; }
    }
    :is([data-gs-table="ledger"] .gs-table:not([data-table]), .gs-table[data-table="ledger"]) {
        & thead th { text-transform: uppercase; font-size: var(--gs-font-size-sm); letter-spacing: 0.06em; border-bottom: 2px solid var(--gs-table-total-rule) !important; }
        & tfoot tr:first-child > * { border-top: 3px double var(--gs-table-total-rule) !important; }
        & tbody td { font-variant-numeric: tabular-nums; }
    }
    .gs-table[data-density="compact"] { --gs-size-row-h: 32px; --gs-cell-pad-y: 5px; }
    .gs-table[data-density="regular"] { --gs-size-row-h: 38px; --gs-cell-pad-y: 8px; }
    .gs-table[data-density="comfortable"] { --gs-size-row-h: 44px; --gs-cell-pad-y: 12px; }
    .gs-table__empty { text-align: center; color: var(--gs-color-text-muted) !important; padding: var(--gs-space-6) !important; }
    .gs-table a { color: var(--gs-color-link) !important; }

    /* ---------- status badge ---------- */
    .gs-badge {
        --gs-tone: var(--gs-color-text-muted);
        display: inline-flex; align-items: center; gap: 0.4em;
        font-size: var(--gs-font-size-sm); line-height: 1.6; white-space: nowrap; vertical-align: middle;
    }
    .gs-badge--lg { font-size: var(--gs-font-size-base); }
    [data-tone="doc-draft"] { --gs-tone: var(--gs-color-doc-draft); }
    [data-tone="doc-ready"] { --gs-tone: var(--gs-color-doc-ready); }
    [data-tone="doc-posted"] { --gs-tone: var(--gs-color-doc-posted); }
    [data-tone="doc-cancelled"] { --gs-tone: var(--gs-color-doc-cancelled); }
    [data-tone="doc-approved"] { --gs-tone: var(--gs-color-doc-approved); }
    [data-tone="doc-rejected"] { --gs-tone: var(--gs-color-doc-rejected); }
    [data-tone="status-deployed"] { --gs-tone: var(--gs-color-status-deployed); }
    [data-tone="status-ready"] { --gs-tone: var(--gs-color-status-ready); }
    [data-tone="status-pending"] { --gs-tone: var(--gs-color-status-pending); }
    [data-tone="status-undeployable"] { --gs-tone: var(--gs-color-status-undeployable); }
    [data-tone="status-archived"] { --gs-tone: var(--gs-color-status-archived); }
    [data-tone="success"] { --gs-tone: var(--gs-color-success); }
    [data-tone="warning"] { --gs-tone: var(--gs-color-warning); }
    [data-tone="danger"] { --gs-tone: var(--gs-color-danger); }
    [data-tone="info"] { --gs-tone: var(--gs-color-info); }
    .gs-badge__icon { font-size: 0.9em; }
    /* tinted: bordered pill with icon */
    [data-gs-status-style="tinted"] .gs-badge {
        padding: 0 0.65em;
        border: var(--gs-border-width) solid var(--gs-tone);
        border-radius: 999px;
        background: color-mix(in oklab, var(--gs-tone) 12%, var(--gs-color-surface));
        color: color-mix(in oklab, var(--gs-tone) 80%, var(--gs-color-text)) !important;
    }
    /* chip: mono uppercase */
    [data-gs-status-style="chip"] .gs-badge {
        padding: 0 0.55em;
        border-radius: var(--gs-radius-sm);
        background: var(--gs-tone);
        color: var(--gs-color-surface) !important;
        font-family: var(--gs-font-mono);
        text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.78em;
    }
    [data-gs-status-style="chip"] .gs-badge__icon { display: none; }
    /* text: icon + coloured text, no fill */
    [data-gs-status-style="text"] .gs-badge { color: var(--gs-tone) !important; font-weight: 600; }

    /* ---------- status tabs ---------- */
    .gs-tabs { display: flex; gap: var(--gs-space-1); overflow-x: auto; overflow-y: hidden; border-bottom: var(--gs-border-width) solid var(--gs-color-border); margin: 0 0 var(--gs-space-3); padding: 0; list-style: none; scrollbar-width: thin; }
    .gs-tabs__item { flex: none; }
    .gs-tabs__link {
        display: inline-flex; align-items: center; gap: var(--gs-space-2);
        min-height: var(--gs-size-control-h); padding: 0 var(--gs-space-3);
        color: var(--gs-color-text-muted) !important; text-decoration: none !important;
        border-bottom: 2px solid transparent; margin-bottom: -1px;
        border-radius: var(--gs-radius-sm) var(--gs-radius-sm) 0 0;
    }
    .gs-tabs__link:hover { color: var(--gs-color-text) !important; background: var(--gs-color-surface-sunken); }
    .gs-tabs__link[aria-current="page"] { color: var(--gs-color-primary) !important; border-bottom-color: var(--gs-color-primary); font-weight: 600; }
    .gs-tabs__count { min-width: 1.8em; padding: 0 0.45em; border-radius: 999px; background: var(--gs-color-surface-sunken); color: var(--gs-color-text-muted); font-size: var(--gs-font-size-sm); text-align: center; font-variant-numeric: tabular-nums; }
    .gs-tabs__link[aria-current="page"] .gs-tabs__count { background: var(--gs-color-primary-subtle); color: var(--gs-color-text); }
    .gs-tabs__count--zero { opacity: 0.6; }

    /* ---------- bulk bar ---------- */
    .gs-bulk-bar {
        display: flex; align-items: center; gap: var(--gs-space-3); flex-wrap: wrap;
        padding: var(--gs-space-2) var(--gs-space-3); margin-bottom: var(--gs-space-2);
        background: var(--gs-color-primary-subtle); color: var(--gs-color-text);
        border: var(--gs-border-width) solid var(--gs-color-primary); border-radius: var(--gs-radius-md);
        min-height: var(--gs-size-row-h);
    }
    .gs-bulk-bar[hidden] { display: none; }
    .gs-bulk-bar__count { font-weight: 600; }
    .gs-bulk-bar__actions { display: flex; gap: var(--gs-space-2); margin-left: auto; }

    /* ---------- stepper ---------- */
    .gs-stepper { display: flex; gap: 0; list-style: none; margin: 0 0 var(--gs-space-4); padding: 0; counter-reset: gs-step; }
    .gs-stepper--vertical { flex-direction: column; }
    .gs-step { flex: 1; display: flex; align-items: center; gap: var(--gs-space-2); min-height: var(--gs-size-row-h); color: var(--gs-color-text-muted); position: relative; }
    .gs-stepper:not(.gs-stepper--vertical) .gs-step + .gs-step::before { content: ""; flex: 0 0 var(--gs-space-5); height: 2px; background: var(--gs-color-border); margin-right: var(--gs-space-2); }
    .gs-step__marker {
        flex: none; width: 1.9em; height: 1.9em; display: inline-flex; align-items: center; justify-content: center;
        border-radius: 999px; border: 2px solid var(--gs-color-border-strong); background: var(--gs-color-surface); font-size: var(--gs-font-size-sm); font-weight: 600;
    }
    .gs-step--done { color: var(--gs-color-text); }
    .gs-step--done .gs-step__marker { background: var(--gs-color-success); border-color: var(--gs-color-success); color: var(--gs-color-on-success); }
    .gs-step--done + .gs-step::before { background: var(--gs-color-success) !important; }
    .gs-step--current { color: var(--gs-color-text); font-weight: 600; }
    .gs-step--current .gs-step__marker { border-color: var(--gs-color-primary); color: var(--gs-color-primary); box-shadow: 0 0 0 3px var(--gs-color-primary-subtle); }
    .gs-step--blocked .gs-step__marker { border-color: var(--gs-color-danger); color: var(--gs-color-danger); }
    .gs-step--blocked { color: var(--gs-color-danger); }
    [data-gs-status-style="chip"] .gs-step__marker { border-radius: var(--gs-radius-sm); }
    [data-gs-status-style="text"] .gs-step__marker { border-width: 1px; }

    /* ---------- KPI ---------- */
    .gs-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--gs-space-3); margin-bottom: var(--gs-space-4); }
    .gs-kpi {
        --gs-kpi-tone: var(--gs-color-primary);
        display: flex; flex-direction: column; gap: var(--gs-space-1);
        padding: var(--gs-space-4);
        background: var(--gs-color-surface); color: var(--gs-color-text) !important;
        border: var(--gs-border-width) solid var(--gs-color-border); border-radius: var(--gs-radius-md);
        box-shadow: var(--gs-surface-shadow, none);
        text-decoration: none !important; position: relative;
    }
    [data-gs-surfaces="flat"] .gs-kpi { background: transparent; border: 0; border-left: var(--gs-border-width) solid var(--gs-color-border); border-radius: 0; box-shadow: none; }
    .gs-kpi--link:hover { border-color: var(--gs-kpi-tone); }
    .gs-kpi__label { color: var(--gs-color-text-muted); font-size: var(--gs-font-size-sm); display: flex; gap: var(--gs-space-2); align-items: center; }
    .gs-kpi__icon { color: var(--gs-kpi-tone); }
    .gs-kpi__value { font-family: var(--gs-font-display); font-size: 1.9em; line-height: 1.15; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .gs-kpi__bn { font-family: var(--gs-font-bengali); color: var(--gs-color-text-muted); font-size: var(--gs-font-size-sm); }
    .gs-kpi__delta { font-size: var(--gs-font-size-sm); font-weight: 600; }
    .gs-kpi__delta--up { color: var(--gs-color-success); }
    .gs-kpi__delta--down { color: var(--gs-color-danger); }
    .gs-kpi--success { --gs-kpi-tone: var(--gs-color-success); }
    .gs-kpi--warning { --gs-kpi-tone: var(--gs-color-warning); }
    .gs-kpi--danger { --gs-kpi-tone: var(--gs-color-danger); }
    .gs-kpi--muted { --gs-kpi-tone: var(--gs-color-text-muted); }

    /* ---------- filter bar ---------- */
    .gs-filter-bar { margin-bottom: var(--gs-space-3); }
    .gs-filter-bar__fields { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--gs-space-3); }
    .gs-filter-bar__fields > * { min-width: 160px; flex: 1 1 160px; }
    .gs-filter-bar__actions { display: flex; gap: var(--gs-space-2); flex: 0 0 auto !important; min-width: 0 !important; }
    .gs-filter-bar__toggle { display: none; }
    @media (max-width: 767px) {
        .gs-filter-bar__toggle { display: inline-flex; }
        .gs-filter-bar:not([data-open="true"]) .gs-filter-bar__fields { display: none; }
    }
    .gs-filter-bar__active { display: inline-block; min-width: 1.6em; padding: 0 0.4em; border-radius: 999px; background: var(--gs-color-primary); color: var(--gs-color-on-primary); font-size: var(--gs-font-size-sm); text-align: center; }

    /* ---------- key / value ---------- */
    .gs-kv { display: grid; grid-template-columns: repeat(var(--gs-kv-columns, 2), minmax(0, 1fr)); gap: 0 var(--gs-space-5); margin: 0 0 var(--gs-space-4); }
    .gs-kv__item { display: grid; grid-template-columns: minmax(110px, 40%) 1fr; gap: var(--gs-space-3); padding: var(--gs-cell-pad-y, 6px) 0; border-bottom: var(--gs-border-width) solid var(--gs-color-border); min-height: var(--gs-size-row-h); align-items: baseline; }
    .gs-kv__label { color: var(--gs-color-text-muted); font-weight: 500; margin: 0; }
    .gs-kv__value { margin: 0; overflow-wrap: anywhere; color: var(--gs-color-text); }
    [data-gs-type="serif-display"] .gs-kv__label { font-variant: small-caps; letter-spacing: 0.03em; }
    @media (max-width: 767px) { .gs-kv { grid-template-columns: 1fr; } }

    /* ---------- timeline ---------- */
    .gs-timeline { list-style: none; margin: 0; padding: 0; }
    .gs-timeline__item { position: relative; padding: 0 0 var(--gs-space-3) var(--gs-space-5); }
    .gs-timeline__item::before { content: ""; position: absolute; left: 6px; top: 6px; width: 9px; height: 9px; border-radius: 999px; background: var(--gs-color-primary); }
    .gs-timeline__item::after { content: ""; position: absolute; left: 10px; top: 18px; bottom: 0; width: 1px; background: var(--gs-color-border); }
    .gs-timeline__item:last-child::after { display: none; }
    .gs-timeline__meta { color: var(--gs-color-text-muted); font-size: var(--gs-font-size-sm); }
    .gs-timeline__empty { color: var(--gs-color-text-muted); }

    /* ---------- form row ---------- */
    .gs-form-row { display: grid; grid-template-columns: minmax(140px, 25%) 1fr; gap: var(--gs-space-2) var(--gs-space-4); align-items: start; margin-bottom: var(--gs-space-3); }
    .gs-form-row__label { padding-top: calc((var(--gs-size-control-h) - 1.4em) / 2); font-weight: 600; color: var(--gs-color-text) !important; margin: 0; }
    .gs-form-row__required { color: var(--gs-color-danger); margin-left: 0.2em; }
    .gs-form-row__help { margin: var(--gs-space-1) 0 0 !important; color: var(--gs-color-text-muted) !important; font-size: var(--gs-font-size-sm); }
    .gs-form-row__error { margin: var(--gs-space-1) 0 0 !important; color: var(--gs-color-danger) !important; font-size: var(--gs-font-size-sm); font-weight: 600; }
    .gs-form-row--error .gs-form-row__control :is(input, select, textarea, .form-control) { border-color: var(--gs-color-danger) !important; }
    .gs-form-row__control .form-control { min-height: var(--gs-size-control-h); }
    @media (max-width: 767px) { .gs-form-row { grid-template-columns: 1fr; } .gs-form-row__label { padding-top: 0; } }

    /* ---------- alert ---------- */
    .gs-alert {
        --gs-alert-tone: var(--gs-color-info);
        --gs-alert-bg: var(--gs-color-info-subtle);
        display: flex; gap: var(--gs-space-3); align-items: flex-start;
        padding: var(--gs-space-3) var(--gs-space-4); margin-bottom: var(--gs-space-3);
        background: var(--gs-alert-bg); color: var(--gs-color-text);
        border: var(--gs-border-width) solid var(--gs-alert-tone); border-left-width: 4px;
        border-radius: var(--gs-radius-md);
    }
    [data-gs-surfaces="flat"] .gs-alert { border-width: 0 0 0 3px; border-radius: 0; }
    .gs-alert--success { --gs-alert-tone: var(--gs-color-success); --gs-alert-bg: var(--gs-color-success-subtle); }
    .gs-alert--warning { --gs-alert-tone: var(--gs-color-warning); --gs-alert-bg: var(--gs-color-warning-subtle); }
    .gs-alert--danger { --gs-alert-tone: var(--gs-color-danger); --gs-alert-bg: var(--gs-color-danger-subtle); }
    .gs-alert__icon { color: var(--gs-alert-tone); margin-top: 0.15em; }
    .gs-alert__body { flex: 1; }
    .gs-alert__body p { margin: 0 !important; color: inherit !important; }
    .gs-alert__close { background: none; border: 0; color: var(--gs-color-text-muted); cursor: pointer; font-size: 1.2em; line-height: 1; }

    /* ---------- empty state ---------- */
    .gs-empty { text-align: center; padding: var(--gs-space-6) var(--gs-space-4); color: var(--gs-color-text-muted); }
    .gs-empty__icon { font-size: 2.2em; color: var(--gs-color-text-subtle); margin-bottom: var(--gs-space-2); }
    .gs-empty__title { margin: 0 0 var(--gs-space-2) !important; font-family: var(--gs-font-display) !important; color: var(--gs-color-text) !important; font-size: 1.2em !important; }
    .gs-empty__actions { display: flex; justify-content: center; gap: var(--gs-space-2); margin-top: var(--gs-space-3); }

    /* ---------- document (screen + print) ---------- */
    .gs-document {
        --gs-table-row-h: 30px;
        background: var(--gs-color-surface); color: var(--gs-color-text);
        border: var(--gs-border-width) solid var(--gs-color-border);
        padding: var(--gs-space-6); max-width: 210mm; margin: 0 auto var(--gs-space-4);
        font-family: var(--gs-font-sans);
    }
    .gs-document__head { display: grid; grid-template-columns: auto 1fr auto; gap: var(--gs-space-4); align-items: center; border-bottom: 2px solid var(--gs-color-text); padding-bottom: var(--gs-space-3); margin-bottom: var(--gs-space-4); }
    .gs-document__office { text-align: center; }
    .gs-document__office h2, .gs-document__office h3 { margin: 0 !important; font-family: var(--gs-font-display) !important; }
    .gs-document__meta { display: flex; justify-content: space-between; gap: var(--gs-space-4); margin-bottom: var(--gs-space-4); font-size: var(--gs-font-size-sm); }
    .gs-document__signatures { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--gs-space-5); margin-top: var(--gs-space-6); }
    .gs-signature { border-top: 1px solid var(--gs-color-text); padding-top: var(--gs-space-1); text-align: center; font-size: var(--gs-font-size-sm); }
    .gs-document__footer { margin-top: var(--gs-space-5); padding-top: var(--gs-space-2); border-top: var(--gs-border-width) solid var(--gs-color-border); color: var(--gs-color-text-muted); font-size: var(--gs-font-size-sm); }
    .gs-document .gs-table thead th { text-transform: uppercase; font-size: var(--gs-font-size-sm); letter-spacing: 0.05em; border-bottom: 2px solid var(--gs-table-total-rule) !important; }
    .gs-document .gs-table tfoot tr:first-child > * { border-top: 3px double var(--gs-table-total-rule) !important; }

    /* ---------- notices injected by gs-theme.js ---------- */
    .gs-notice { margin: var(--gs-space-2) var(--gs-space-4); }
}

@media print {
    @layer gs-components {
        .gs-document { border: 0; padding: 0; max-width: none; margin: 0; }
        .gs-document .gs-table th, .gs-document .gs-table td { background: transparent !important; }
        .gs-bulk-bar, .gs-filter-bar, .gs-page-header__actions, .gs-box__tools, .gs-alert__close, .gs-notice { display: none !important; }
        .gs-box, .gs-kpi { box-shadow: none !important; }
    }
}

/* 15-general.css */
/*
 * General-purpose UI kit (@layer gs-components): buttons, badges, spinners, progress, accordion,
 * cards, tiles, lists, avatars, tabs, KPI layouts and alert appearances — plus the `elevated`
 * surface treatment for kit components. Only .gs-* classes and --gs-* tokens; every component
 * follows the active theme and mode, so the same markup works in all themes.
 */
@layer gs-components {

    /* ---------- tones (shared by button, badge, spinner, progress, tile, avatar) ---------- */
    .gs-tone-primary, .gs-btn--primary, .gs-tag--primary { --gs-kit-tone: var(--gs-color-primary); --gs-kit-on: var(--gs-color-on-primary); }
    .gs-tone-secondary, .gs-btn--secondary, .gs-tag--secondary { --gs-kit-tone: var(--gs-color-accent); --gs-kit-on: var(--gs-color-on-accent); }
    .gs-tone-success, .gs-btn--success, .gs-tag--success { --gs-kit-tone: var(--gs-color-success); --gs-kit-on: var(--gs-color-on-success); }
    .gs-tone-danger, .gs-btn--danger, .gs-tag--danger { --gs-kit-tone: var(--gs-color-danger); --gs-kit-on: var(--gs-color-on-danger); }
    .gs-tone-warning, .gs-btn--warning, .gs-tag--warning { --gs-kit-tone: var(--gs-color-warning); --gs-kit-on: var(--gs-color-on-warning); }
    .gs-tone-info, .gs-btn--info, .gs-tag--info { --gs-kit-tone: var(--gs-color-info); --gs-kit-on: var(--gs-color-on-info); }
    .gs-tone-light, .gs-btn--light, .gs-tag--light { --gs-kit-tone: var(--gs-color-surface-sunken); --gs-kit-on: var(--gs-color-text); --gs-kit-line: var(--gs-color-border-strong); }
    .gs-tone-dark, .gs-btn--dark, .gs-tag--dark { --gs-kit-tone: var(--gs-color-text); --gs-kit-on: var(--gs-color-surface); }
    .gs-tone-muted { --gs-kit-tone: var(--gs-color-text-muted); --gs-kit-on: var(--gs-color-surface); }
    .gs-tone-current { --gs-kit-tone: currentColor; --gs-kit-on: var(--gs-color-surface); }

    /* ---------- buttons ---------- */
    .gs-btn { position: relative; justify-content: center; line-height: 1.2; transition: background-color .15s, box-shadow .15s, border-color .15s; }
    .gs-btn:is(.gs-btn--primary, .gs-btn--secondary, .gs-btn--success, .gs-btn--danger, .gs-btn--warning, .gs-btn--info, .gs-btn--light, .gs-btn--dark) {
        background: var(--gs-kit-tone);
        border-color: var(--gs-kit-line, var(--gs-kit-tone));
        color: var(--gs-kit-on) !important;
    }
    .gs-btn:is(.gs-btn--primary, .gs-btn--secondary, .gs-btn--success, .gs-btn--danger, .gs-btn--warning, .gs-btn--info, .gs-btn--light, .gs-btn--dark):not(:disabled):hover {
        /* Mixing toward the text colour darkens in light mode and lightens in dark mode. */
        background: color-mix(in oklab, var(--gs-kit-tone) 86%, var(--gs-color-text));
    }
    .gs-btn.gs-btn--outline { background: transparent; border-color: var(--gs-kit-line, var(--gs-kit-tone)); color: var(--gs-kit-tone) !important; }
    .gs-btn--light.gs-btn--outline { color: var(--gs-color-text) !important; }
    .gs-btn.gs-btn--outline:not(:disabled):hover { background: var(--gs-kit-tone); color: var(--gs-kit-on) !important; }
    .gs-btn--pill { border-radius: 999px; }
    .gs-btn--sm { min-height: calc(var(--gs-size-control-h) - 6px); padding: 0 var(--gs-space-3); font-size: var(--gs-font-size-sm); }
    .gs-btn--lg { min-height: calc(var(--gs-size-control-h) + 10px); padding: 0 var(--gs-space-5); font-size: 1.1em; }
    .gs-btn:disabled { opacity: .6; cursor: not-allowed; }
    .gs-btn[aria-busy="true"] { cursor: progress; }
    [data-gs-surfaces="elevated"] .gs-btn:is(.gs-btn--primary, .gs-btn--secondary, .gs-btn--success, .gs-btn--danger, .gs-btn--info, .gs-btn--dark):not(.gs-btn--outline):not(:disabled):hover {
        box-shadow: 0 8px 25px -8px var(--gs-kit-tone);
    }

    .gs-btn-group { display: inline-flex; }
    .gs-btn-group > .gs-btn:not(:first-child) { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: calc(var(--gs-border-width) * -1); }
    .gs-btn-group > .gs-btn:not(:last-child) { border-top-right-radius: 0; border-bottom-right-radius: 0; }
    .gs-btn-group > .gs-btn:hover, .gs-btn-group > .gs-btn:focus-visible { z-index: 1; }

    /* ---------- badge (general purpose, .gs-tag) ---------- */
    .gs-tag {
        display: inline-flex; align-items: center; gap: .3em;
        padding: .15em .55em; border: var(--gs-border-width) solid var(--gs-kit-line, var(--gs-kit-tone));
        border-radius: var(--gs-radius-sm);
        background: var(--gs-kit-tone); color: var(--gs-kit-on) !important;
        font-size: .78em; font-weight: 600; line-height: 1.35; white-space: nowrap; vertical-align: middle;
    }
    .gs-tag--outline { background: transparent; color: var(--gs-kit-tone) !important; }
    .gs-tag--light.gs-tag--outline { color: var(--gs-color-text) !important; }
    .gs-tag--pill { border-radius: 999px; }
    .gs-tag--floating { position: absolute; top: 0; right: 0; transform: translate(40%, -45%); min-width: 1.6em; justify-content: center; box-shadow: 0 0 0 2px var(--gs-color-surface); }
    .gs-tag--floating:empty { min-width: 0; width: .9em; height: .9em; padding: 0; }

    /* ---------- spinner ---------- */
    .gs-spinner { --gs-spin-size: 2rem; display: inline-flex; align-items: center; justify-content: center; gap: calc(var(--gs-spin-size) / 8); color: var(--gs-kit-tone, var(--gs-color-primary)); vertical-align: middle; }
    .gs-spinner--sm { --gs-spin-size: 1em; }
    .gs-spinner--lg { --gs-spin-size: 3rem; }
    .gs-spinner--ring::before {
        content: ""; width: var(--gs-spin-size); height: var(--gs-spin-size); border-radius: 50%;
        border: max(2px, calc(var(--gs-spin-size) / 9)) solid color-mix(in oklab, currentColor 20%, transparent);
        border-top-color: currentColor; animation: gs-spin .8s linear infinite;
    }
    .gs-spinner--pulse::before {
        content: ""; width: var(--gs-spin-size); height: var(--gs-spin-size); border-radius: 50%;
        background: currentColor; animation: gs-pulse 1.2s ease-in-out infinite;
    }
    .gs-spinner--dots > span { width: calc(var(--gs-spin-size) / 4); height: calc(var(--gs-spin-size) / 4); border-radius: 50%; background: currentColor; animation: gs-dot 1.2s ease-in-out infinite; }
    .gs-spinner--dots > span:nth-child(2) { animation-delay: .15s; }
    .gs-spinner--dots > span:nth-child(3) { animation-delay: .3s; }
    @keyframes gs-spin { to { transform: rotate(360deg); } }
    @keyframes gs-pulse { 0% { transform: scale(.2); opacity: .9; } 100% { transform: scale(1); opacity: 0; } }
    @keyframes gs-dot { 0%, 80%, 100% { transform: scale(.4); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
        .gs-spinner--ring::before { animation-duration: 2.4s; }
        .gs-spinner--pulse::before, .gs-spinner--dots > span { animation: none; opacity: .7; }
    }

    /* ---------- progress ---------- */
    .gs-progress { margin-bottom: var(--gs-space-3); }
    .gs-progress__head { display: flex; justify-content: space-between; gap: var(--gs-space-2); margin-bottom: var(--gs-space-1); font-size: var(--gs-font-size-sm); }
    .gs-progress__label { color: var(--gs-color-text-muted); }
    .gs-progress__value { font-weight: 600; font-variant-numeric: tabular-nums; }
    .gs-progress__track { display: block; height: 6px; border-radius: 999px; background: var(--gs-color-surface-sunken); box-shadow: inset 0 0 0 var(--gs-border-width) var(--gs-color-border); overflow: hidden; }
    .gs-progress--sm .gs-progress__track { height: 4px; }
    .gs-progress--lg .gs-progress__track { height: 10px; }
    .gs-progress__bar { display: block; height: 100%; border-radius: inherit; background: var(--gs-kit-tone, var(--gs-color-primary)); transition: width .3s; }
    .gs-progress__caption { margin: var(--gs-space-1) 0 0 !important; color: var(--gs-color-text-muted) !important; font-size: var(--gs-font-size-sm); }

    /* ---------- accordion ---------- */
    .gs-accordion { margin-bottom: var(--gs-space-4); border: var(--gs-border-width) solid var(--gs-color-border); border-radius: var(--gs-radius-md); background: var(--gs-color-surface); overflow: hidden; }
    .gs-accordion__item + .gs-accordion__item { border-top: var(--gs-border-width) solid var(--gs-color-border); }
    .gs-accordion__summary {
        display: flex; align-items: center; gap: var(--gs-space-2);
        min-height: var(--gs-size-row-h); padding: var(--gs-space-2) var(--gs-space-4);
        cursor: pointer; list-style: none; font-weight: 600; color: var(--gs-color-text);
    }
    /* Snipe-IT's base CSS sets `summary { display: list-item }` unlayered, which beats a layered display. */
    .gs-accordion__summary { display: flex !important; }
    .gs-accordion__summary::-webkit-details-marker { display: none; }
    .gs-accordion__summary:hover { background: var(--gs-color-surface-sunken); }
    .gs-accordion__summary:focus-visible { outline: 2px solid var(--gs-color-focus-ring); outline-offset: -2px; }
    .gs-accordion__title { flex: 1; }
    .gs-accordion__chevron { color: var(--gs-color-text-muted); transition: transform .2s; }
    .gs-accordion__item[open] > .gs-accordion__summary { color: var(--gs-color-primary); }
    .gs-accordion__item[open] .gs-accordion__chevron { transform: rotate(180deg); }
    .gs-accordion__body { padding: 0 var(--gs-space-4) var(--gs-space-4); color: var(--gs-color-text); }

    /* ---------- card ---------- */
    .gs-card {
        display: flex; flex-direction: column; overflow: hidden;
        background: var(--gs-color-surface); color: var(--gs-color-text);
        border: var(--gs-border-width) solid var(--gs-color-border); border-radius: var(--gs-radius-md);
        box-shadow: var(--gs-surface-shadow, none); margin-bottom: var(--gs-space-4);
    }
    .gs-card--center { text-align: center; align-items: stretch; }
    .gs-card__header { padding: var(--gs-space-2) var(--gs-space-4); background: var(--gs-color-surface-sunken); border-bottom: var(--gs-border-width) solid var(--gs-color-border); color: var(--gs-color-text-muted); font-size: var(--gs-font-size-sm); }
    .gs-card__media { display: block; width: 100%; max-height: 220px; object-fit: cover; }
    .gs-card__body { flex: 1; padding: var(--gs-space-4); }
    .gs-card__title { margin: 0 0 var(--gs-space-2) !important; font-size: 1.2em !important; font-family: var(--gs-font-display) !important; font-weight: var(--gs-font-heading-weight) !important; color: var(--gs-color-text) !important; }
    .gs-card__subtitle { margin: 0 0 var(--gs-space-3) !important; color: var(--gs-color-text-muted) !important; font-size: var(--gs-font-size-sm); }
    .gs-card__actions { display: flex; flex-wrap: wrap; gap: var(--gs-space-3); padding: 0 var(--gs-space-4) var(--gs-space-4); }
    .gs-card--center .gs-card__actions { justify-content: center; }
    .gs-card__footer { padding: var(--gs-space-2) var(--gs-space-4); border-top: var(--gs-border-width) solid var(--gs-color-border); color: var(--gs-color-text-muted); font-size: var(--gs-font-size-sm); }
    [data-gs-surfaces="flat"] .gs-card { border-radius: 0; box-shadow: none; border-width: var(--gs-border-width) 0 0; background: transparent; }

    /* ---------- tile ---------- */
    .gs-tile {
        display: flex; align-items: center; gap: var(--gs-space-3);
        padding: var(--gs-space-4) var(--gs-space-5); margin-bottom: var(--gs-space-3);
        border: var(--gs-border-width) solid var(--gs-color-border-strong); border-radius: var(--gs-radius-md);
        background: var(--gs-color-surface); color: var(--gs-color-text) !important; text-decoration: none !important;
    }
    .gs-tile__icon { font-size: 2em; color: var(--gs-kit-tone); flex: none; }
    .gs-tile__text { display: flex; flex-direction: column; min-width: 0; }
    .gs-tile__title { font-size: 1.15em; font-weight: 600; line-height: 1.3; }
    .gs-tile__meta { font-size: var(--gs-font-size-sm); color: var(--gs-color-text-muted); }
    .gs-tile--filled { background: var(--gs-kit-tone); border-color: var(--gs-kit-tone); color: var(--gs-kit-on) !important; }
    .gs-tile--filled .gs-tile__icon, .gs-tile--filled .gs-tile__meta { color: inherit; }
    .gs-tile--link:hover { border-color: var(--gs-kit-tone); box-shadow: var(--gs-shadow-1); }
    .gs-tile--filled.gs-tile--link:hover { background: color-mix(in oklab, var(--gs-kit-tone) 86%, var(--gs-color-text)); }

    /* ---------- avatar ---------- */
    .gs-avatar {
        --gs-avatar-size: 40px;
        display: inline-flex; align-items: center; justify-content: center; flex: none;
        width: var(--gs-avatar-size); height: var(--gs-avatar-size); border-radius: 50%; overflow: hidden;
        background: color-mix(in oklab, var(--gs-kit-tone) 16%, var(--gs-color-surface)); color: var(--gs-kit-tone);
        font-weight: 700; font-size: calc(var(--gs-avatar-size) * .38); line-height: 1;
    }
    .gs-avatar--sm { --gs-avatar-size: 28px; }
    .gs-avatar--lg { --gs-avatar-size: 64px; }
    .gs-avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* ---------- list ---------- */
    .gs-list { list-style: none; margin: 0 0 var(--gs-space-4); padding: 0; }
    .gs-list__item { display: flex; align-items: center; gap: var(--gs-space-3); padding: var(--gs-space-3) 0; min-height: var(--gs-size-row-h); }
    .gs-list--divided .gs-list__item + .gs-list__item { border-top: var(--gs-border-width) solid var(--gs-color-border); }
    .gs-list--cards .gs-list__item {
        padding: var(--gs-space-3) var(--gs-space-4); margin-bottom: var(--gs-space-3);
        background: var(--gs-color-surface); border: var(--gs-border-width) solid var(--gs-color-border);
        border-radius: var(--gs-radius-md); box-shadow: var(--gs-surface-shadow, none);
    }
    .gs-list__media { width: 56px; height: 56px; object-fit: cover; border-radius: var(--gs-radius-sm); flex: none; background: var(--gs-color-surface-sunken); }
    .gs-list__icon { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; flex: none; border-radius: var(--gs-radius-md); background: var(--gs-color-primary-subtle); color: var(--gs-color-primary); }
    .gs-list__text { display: flex; flex-direction: column; flex: 1; min-width: 0; }
    .gs-list__title { color: var(--gs-color-text) !important; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    a.gs-list__title:hover { color: var(--gs-color-link) !important; }
    .gs-list__subtitle { color: var(--gs-color-text-muted); font-size: var(--gs-font-size-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gs-list__meta { flex: none; font-variant-numeric: tabular-nums; color: var(--gs-color-text); font-weight: 600; text-align: right; }
    .gs-list__actions { flex: none; display: flex; gap: var(--gs-space-2); }

    /* ---------- tabs (in-page) ---------- */
    .gs-tabset { margin-bottom: var(--gs-space-4); }
    .gs-tabset__list { display: flex; overflow-x: auto; border-bottom: 2px solid var(--gs-color-border); scrollbar-width: thin; }
    .gs-tabset--justified .gs-tabset__tab { flex: 1; justify-content: center; }
    .gs-tabset__tab {
        display: inline-flex; align-items: center; gap: var(--gs-space-2);
        min-height: calc(var(--gs-size-control-h) + 12px); padding: 0 var(--gs-space-4); margin-bottom: -2px;
        background: transparent; border: 0; border-bottom: 2px solid transparent;
        color: var(--gs-color-text-muted); font: inherit; cursor: pointer; white-space: nowrap;
    }
    .gs-tabset__tab:hover { color: var(--gs-color-text); background: var(--gs-color-surface-sunken); }
    .gs-tabset__tab[aria-selected="true"] { color: var(--gs-color-text); background: var(--gs-color-primary-subtle); border-bottom-color: var(--gs-color-primary); font-weight: 600; }
    .gs-tabset__tab:focus-visible { outline: 2px solid var(--gs-color-focus-ring); outline-offset: -2px; }
    .gs-tabset__panel { padding: var(--gs-space-4) 0 0; }
    .gs-tabset__panel:focus-visible { outline: 2px solid var(--gs-color-focus-ring); outline-offset: 2px; }

    /* ---------- KPI layouts, sparkline, usage bar ---------- */
    .gs-kpi__main { display: flex; flex-direction: column; gap: var(--gs-space-1); min-width: 0; flex: 1; }
    .gs-kpi--icon-left { flex-direction: row; align-items: center; gap: var(--gs-space-4); }
    .gs-kpi--centered { align-items: center; text-align: center; }
    .gs-kpi--centered .gs-kpi__main { align-items: center; }
    .gs-kpi__icon--lg { font-size: 2.6em; color: var(--gs-kpi-tone); opacity: .55; flex: none; }
    .gs-kpi--centered .gs-kpi__icon--lg { font-size: 2em; opacity: .7; }
    .gs-kpi--icon-left .gs-kpi__value, .gs-kpi--centered .gs-kpi__value { color: var(--gs-kpi-tone); font-weight: 500; }
    .gs-kpi__spark { display: block; width: 100%; height: 40px; margin-top: var(--gs-space-2); overflow: visible; }
    .gs-kpi__spark polyline { stroke: var(--gs-kpi-tone); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .gs-kpi__progress { display: block; height: 5px; margin-top: var(--gs-space-2); border-radius: 999px; background: var(--gs-color-surface-sunken); box-shadow: inset 0 0 0 var(--gs-border-width) var(--gs-color-border); overflow: hidden; }
    .gs-kpi__progress > span { display: block; height: 100%; background: var(--gs-kpi-tone); border-radius: inherit; }
    .gs-kpi__caption { color: var(--gs-color-text-muted); font-size: var(--gs-font-size-sm); }
    .gs-kpi--info { --gs-kpi-tone: var(--gs-color-info); }

    /* ---------- alert appearances ---------- */
    .gs-alert--outline { background: var(--gs-color-surface); border-left-width: var(--gs-border-width); }
    .gs-alert--outline .gs-alert__body > strong { color: var(--gs-alert-tone); }
    .gs-alert--card { background: var(--gs-color-surface); border: 0; border-top: 3px solid var(--gs-alert-tone); box-shadow: var(--gs-shadow-1); }
    [data-gs-surfaces="flat"] .gs-alert--card { box-shadow: none; border-bottom: var(--gs-border-width) solid var(--gs-color-border); }

    /* ---------- link-rendered components ----------
       Snipe-IT's unlayered base CSS has `a { background-color: transparent }`, and unlayered rules beat
       layered ones; button, tile and KPI rendered as <a> therefore restate their fill with !important. */
    a.gs-btn { background-color: var(--gs-color-surface) !important; }
    a.gs-btn:hover { background-color: var(--gs-color-surface-sunken) !important; }
    a.gs-btn:is(.gs-btn--primary, .gs-btn--secondary, .gs-btn--success, .gs-btn--danger, .gs-btn--warning, .gs-btn--info, .gs-btn--light, .gs-btn--dark) { background-color: var(--gs-kit-tone) !important; }
    a.gs-btn:is(.gs-btn--primary, .gs-btn--secondary, .gs-btn--success, .gs-btn--danger, .gs-btn--warning, .gs-btn--info, .gs-btn--light, .gs-btn--dark):hover { background-color: color-mix(in oklab, var(--gs-kit-tone) 86%, var(--gs-color-text)) !important; }
    a.gs-btn.gs-btn--outline, a.gs-btn.gs-btn--ghost { background-color: transparent !important; }
    a.gs-btn.gs-btn--outline:hover { background-color: var(--gs-kit-tone) !important; }
    a.gs-tile { background-color: var(--gs-color-surface) !important; }
    a.gs-tile.gs-tile--filled { background-color: var(--gs-kit-tone) !important; }
    a.gs-tile.gs-tile--filled:hover { background-color: color-mix(in oklab, var(--gs-kit-tone) 86%, var(--gs-color-text)) !important; }
    a.gs-kpi { background-color: var(--gs-color-surface) !important; }
    [data-gs-surfaces="flat"] a.gs-kpi { background-color: transparent !important; }

    /* ---------- elevated surfaces: borderless, rounded, soft shadow ---------- */
    [data-gs-surfaces="elevated"] :is(.gs-box, .gs-kpi, .gs-card, .gs-accordion, .gs-list--cards .gs-list__item) {
        border: 0; border-radius: var(--gs-radius-lg); box-shadow: var(--gs-surface-shadow);
    }
    [data-gs-surfaces="elevated"] .gs-box--primary { border-top: 3px solid var(--gs-color-primary); }
    [data-gs-surfaces="elevated"] .gs-box__header { border-bottom-color: transparent; padding-top: var(--gs-space-4); }
    [data-gs-surfaces="elevated"] .gs-box__title { font-size: 1.2em !important; }
    [data-gs-surfaces="elevated"] .gs-page-header { border-bottom-color: var(--gs-color-border); }
    [data-gs-surfaces="elevated"] .gs-kpi--link:hover { box-shadow: var(--gs-shadow-2); }

    /* ---------- code segments (<x-gs::code-segments>): a structured code as labelled parts ---------- */
    .gs-segs { display: inline-flex; flex-wrap: wrap; gap: var(--gs-space-1); align-items: flex-start; }
    .gs-seg { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
    .gs-seg__v {
        --gs-seg-tone: var(--gs-color-text-muted);
        --gs-seg-bg: var(--gs-color-surface-sunken);
        font-family: var(--gs-font-mono); font-size: 1.15em; font-weight: 600; letter-spacing: 0.08em;
        padding: var(--gs-space-1) var(--gs-space-2); border-radius: var(--gs-radius-sm);
        color: var(--gs-seg-tone); background: var(--gs-seg-bg);
        border: var(--gs-border-width) solid color-mix(in oklab, var(--gs-seg-tone) 35%, var(--gs-seg-bg));
        min-width: 2.6em; text-align: center;
    }
    .gs-seg[data-tone="primary"] .gs-seg__v { --gs-seg-tone: var(--gs-color-primary); --gs-seg-bg: var(--gs-color-primary-subtle); }
    .gs-seg[data-tone="info"] .gs-seg__v { --gs-seg-tone: var(--gs-color-info); --gs-seg-bg: var(--gs-color-info-subtle); }
    .gs-seg[data-tone="success"] .gs-seg__v { --gs-seg-tone: var(--gs-color-success); --gs-seg-bg: var(--gs-color-success-subtle); }
    .gs-seg[data-tone="warning"] .gs-seg__v { --gs-seg-tone: var(--gs-color-warning); --gs-seg-bg: var(--gs-color-warning-subtle); }
    .gs-seg[data-tone="muted"] .gs-seg__v { --gs-seg-tone: var(--gs-color-text-subtle); --gs-seg-bg: var(--gs-color-surface); }
    .gs-seg--pending .gs-seg__v { border-style: dashed; background: var(--gs-color-surface); color: var(--gs-color-text-subtle); }
    .gs-seg__l { font-size: 0.7rem; color: var(--gs-color-text-muted); text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
    .gs-segs--sm { gap: 2px; }
    .gs-segs--sm .gs-seg__v { font-size: 0.95em; padding: 1px var(--gs-space-1); min-width: 0; }
    .gs-segs--sm .gs-seg__l { display: none; }
}

/* 16-workflow.css */
/*
 * Workflow kit (@layer gs-components): readiness checklist, role slot, action row, choice card and
 * hierarchy trail, for setup and administration flows where the screen should say what to do next.
 * Only .gs-* classes and --gs-* tokens; every component follows the active theme and mode.
 */
@layer gs-components {

    /* ---------- readiness checklist ---------- */
    .gs-readiness { display: flex; flex-direction: column; gap: var(--gs-space-3); }
    .gs-readiness .gs-progress { margin-bottom: 0; }
    .gs-readiness__head { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--gs-space-3); flex-wrap: wrap; }
    .gs-readiness__title { font-size: 1.1em; color: var(--gs-color-text); }
    .gs-readiness__caption { margin: var(--gs-space-1) 0 0 !important; color: var(--gs-color-text-muted) !important; font-size: var(--gs-font-size-sm); }
    .gs-readiness__count { color: var(--gs-color-text-muted); font-size: var(--gs-font-size-sm); font-weight: 600; font-variant-numeric: tabular-nums; }
    .gs-readiness__list { list-style: none; margin: 0; padding: 0; }
    .gs-readiness__item {
        display: flex; align-items: center; gap: var(--gs-space-3);
        min-height: var(--gs-size-row-h); padding: var(--gs-cell-pad-y, 6px) 0;
        border-top: var(--gs-border-width) solid var(--gs-color-border);
    }
    .gs-readiness__item:first-child { border-top: 0; }
    .gs-readiness__icon { font-size: 1.15em; color: var(--gs-color-warning); flex: 0 0 auto; }
    .gs-readiness__item--done .gs-readiness__icon { color: var(--gs-color-success); }
    .gs-readiness__item--optional:not(.gs-readiness__item--done) .gs-readiness__icon { color: var(--gs-color-text-subtle); }
    .gs-readiness__label { flex: 1 1 auto; min-width: 0; color: var(--gs-color-text); }
    .gs-readiness__todo { color: var(--gs-color-warning); font-size: var(--gs-font-size-sm); font-weight: 600; }
    .gs-readiness--compact { gap: 0; }
    .gs-readiness--compact .gs-progress__head { margin-bottom: 2px; }

    /* ---------- role slot ---------- */
    .gs-roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--gs-space-3); }
    .gs-role {
        display: flex; flex-direction: column; gap: var(--gs-space-2);
        padding: var(--gs-space-4); border: var(--gs-border-width) solid var(--gs-color-border);
        border-radius: var(--gs-radius-md); background: var(--gs-color-surface);
    }
    .gs-role--empty { border-style: dashed; border-color: var(--gs-color-border-strong); background: var(--gs-color-surface-sunken); }
    .gs-role--required { border-color: var(--gs-color-warning); background: var(--gs-color-warning-subtle); }
    .gs-role__head { display: flex; align-items: baseline; gap: var(--gs-space-2); flex-wrap: wrap; }
    .gs-role__name { color: var(--gs-color-text); }
    .gs-role__flag { font-size: var(--gs-font-size-sm); font-weight: 600; color: var(--gs-color-warning); }
    .gs-role__flag--muted { color: var(--gs-color-text-muted); font-weight: 500; }
    .gs-role__description { margin: 0 !important; color: var(--gs-color-text-muted) !important; font-size: var(--gs-font-size-sm); }
    .gs-role__body { display: flex; align-items: center; gap: var(--gs-space-3); margin-top: var(--gs-space-1); }
    .gs-role__person { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; }
    .gs-role__person-name { font-weight: 600; color: var(--gs-color-text); }
    .gs-role__person-meta { color: var(--gs-color-text-muted); font-size: var(--gs-font-size-sm); }
    .gs-role__actions { margin-left: auto; display: flex; gap: var(--gs-space-2); }
    .gs-role--empty .gs-role__actions { margin-left: 0; }

    /* ---------- action row (settings, danger zone) ---------- */
    .gs-action-row {
        display: flex; align-items: center; gap: var(--gs-space-4); flex-wrap: wrap;
        padding: var(--gs-space-4) 0; border-top: var(--gs-border-width) solid var(--gs-color-border);
    }
    .gs-action-row:first-child { border-top: 0; }
    .gs-action-row__text { flex: 1 1 320px; min-width: 0; }
    .gs-action-row__title { color: var(--gs-color-text); }
    .gs-action-row__description, .gs-action-row__why { margin: var(--gs-space-1) 0 0 !important; font-size: var(--gs-font-size-sm); color: var(--gs-color-text-muted) !important; }
    .gs-action-row__why { font-weight: 600; }
    .gs-action-row--unavailable .gs-action-row__title { color: var(--gs-color-text-muted); }
    .gs-action-row__actions { display: flex; gap: var(--gs-space-2); flex-wrap: wrap; }

    /* ---------- choice card ---------- */
    .gs-choice {
        display: flex; align-items: flex-start; gap: var(--gs-space-3); margin: 0;
        padding: var(--gs-space-3) var(--gs-space-4); min-height: 44px;
        border: var(--gs-border-width) solid var(--gs-color-border-strong); border-radius: var(--gs-radius-md);
        background: var(--gs-color-surface); color: var(--gs-color-text); font-weight: 400; cursor: pointer;
    }
    .gs-choice:hover { border-color: var(--gs-color-primary); }
    .gs-choice:has(.gs-choice__input:checked) { border-color: var(--gs-color-primary); background: var(--gs-color-primary-subtle); box-shadow: inset 0 0 0 1px var(--gs-color-primary); }
    .gs-choice:has(.gs-choice__input:focus-visible) { outline: 3px solid var(--gs-color-focus-ring); outline-offset: 2px; }
    /* Snipe-IT's unlayered label and input[type=radio] rules (block label, 25 px drawn radio) would otherwise win. */
    .gs-choice { display: flex !important; margin: 0 !important; font-weight: 400 !important; }
    .gs-choice__input {
        -webkit-appearance: auto !important; appearance: auto !important; display: inline-block !important; position: static !important; opacity: 1 !important;
        margin: .2em 0 0 !important; accent-color: var(--gs-color-primary); width: 1.1em !important; height: 1.1em !important; flex: 0 0 auto;
    }
    .gs-choice__icon { color: var(--gs-color-primary); margin-top: .15em; }
    .gs-choice__text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .gs-choice__label { font-weight: 600; }
    .gs-choice__description { color: var(--gs-color-text-muted); font-size: var(--gs-font-size-sm); line-height: 1.4; }
    .gs-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--gs-space-2); }

    /* ---------- hierarchy trail ---------- */
    .gs-trail { display: inline-flex; align-items: baseline; flex-wrap: wrap; gap: 0 var(--gs-space-1); color: var(--gs-color-text-muted); font-size: var(--gs-font-size-sm); }
    .gs-trail__sep { font-size: .8em; color: var(--gs-color-text-subtle); }
    .gs-trail__part:last-child { color: var(--gs-color-text); }
    .gs-trail__bn { color: var(--gs-color-text-muted); }
}

/* 17-monitoring.css */
/* Monitoring kit: theme semantics only, independent of the tracking package. */
@layer gs-components {
.gs-pace { display:grid; gap:5px; min-width:110px; }
.gs-pace__numbers { display:flex; justify-content:space-between; gap:8px; font-size:var(--gs-font-size-sm, 13px); }
.gs-pace__track { position:relative; height:8px; border-radius:var(--gs-radius-sm); background:var(--gs-color-surface-sunken); border:1px solid var(--gs-color-border); }
.gs-pace__fill { display:block; height:100%; background:var(--gs-color-primary); border-radius:inherit; }
.gs-pace__expected { position:absolute; top:-4px; bottom:-4px; border-left:2px solid var(--gs-color-text-subtle); }
.gs-pace small { color:var(--gs-color-text-muted); }
.gs-attention { list-style:none; padding:0; margin:0; display:grid; gap:8px; }
.gs-attention__item { display:flex; align-items:flex-start; gap:12px; padding:12px 14px; background:var(--gs-color-surface); border:1px solid var(--gs-color-border); border-left:4px solid var(--gs-color-info); border-radius:var(--gs-radius-md); }
.gs-attention__item[data-tone="danger"] { border-left-color:var(--gs-color-danger); }
.gs-attention__item[data-tone="warning"] { border-left-color:var(--gs-color-warning); }
.gs-attention__item div { flex:1; min-width:0; }
.gs-attention__item strong,.gs-attention__item small { display:block; }
.gs-attention__item small { color:var(--gs-color-text-muted); }
.gs-attention__item p { margin:3px 0 0; color:var(--gs-color-text-muted); }

function can(a){ return !!CAN[state.role][a]; }
function writer(){ return can('edit'); }

function prefix(){
  var first = P.codes[0] && P.codes[0].code, m = first && first.match(/^(.+-)[^-]+-[^-]+$/);
  if(!m) return '';
  return P.codes.every(function(c){ return c.code.indexOf(m[1])===0; }) ? m[1] : '';
}
function short(c){ var p = prefix(); return p ? c.code.slice(p.length) : c.code; }
function segs(c){
  var p = prefix();
  if(!p) return '<span class="gs-segs gs-segs--sm" role="group" aria-label="'+esc(c.code)+'"><span class="gs-seg" data-tone="primary"><span class="gs-seg__v">'+esc(c.code)+'</span></span></span>';
  return '<span class="gs-segs gs-segs--sm" role="group" aria-label="'+esc(c.code)+'" title="'+esc(c.code)+'"><span class="gs-seg" data-tone="muted"><span class="gs-seg__v">'+esc(p)+'</span></span><span class="gs-seg" data-tone="primary"><span class="gs-seg__v">'+esc(c.code.slice(p.length))+'</span></span></span>';
}
var STATUS = {DRAFT:['doc-draft','fa-pen'], ACTIVE:['success','fa-circle-play'], ARCHIVED:['status-archived','fa-box-archive']};
function badge(status){ var s = STATUS[status]; return '<span class="gs-badge" data-tone="'+s[0]+'" data-status="'+status.toLowerCase()+'">'+icon(s[1]+' gs-badge__icon')+'<span class="gs-badge__label">'+esc(t('s_'+status))+'</span></span>'; }
function tag(text, tone){ return '<span class="gs-tag gs-tag--'+(tone||'secondary')+' gs-tag--pill">'+esc(text)+'</span>'; }
function btn(label, opts){
  opts = opts || {};
  var cls = 'gs-btn gs-btn--'+(opts.tone||'primary')+(opts.outline?' gs-btn--outline':'')+(opts.size?' gs-btn--'+opts.size:' gs-btn--sm');
  var attrs = opts.attrs || '';
  if(opts.disabled) return '<button type="button" class="'+cls+'" disabled title="'+esc(opts.why||'')+'" '+attrs+'>'+(opts.icon?icon(opts.icon):'')+esc(label)+'</button>';
  if(opts.href) return '<a class="'+cls+'" href="'+esc(opts.href)+'" data-link="'+esc(label)+'" '+attrs+'>'+(opts.icon?icon(opts.icon):'')+esc(label)+'</a>';
  return '<button type="button" class="'+cls+'" '+attrs+'>'+(opts.icon?icon(opts.icon):'')+esc(label)+'</button>';
}
function url(path){ return BASE+'/'+P.id+(path?'/'+path:''); }

/* ------------------------------------------------------------------ derived */
function checks(c){
  var list = [];
  list.push({key:'products', ok:c.plan==='1_BLANKET' || c.products.length>0});
  list.push({key:'scope', ok:!!c.geo && c.offices.length>0});
  if(P.rules.docs) list.push({key:'order', ok:c.docs.length>0});
  return list;
}
function missing(c){ return checks(c).filter(function(x){ return !x.ok; }); }
function ready(c){ return missing(c).length===0; }
function needsSetup(c){ return c.status!=='ARCHIVED' && missing(c).length>0; }
function planned(c){ return c.products.reduce(function(s,p){ return s+p.planned; },0); }
function received(c){ return c.products.reduce(function(s,p){ return s+p.received; },0); }
function officesLabel(c){ return c.offices.length===1 ? t('oneOffice') : t('nOffices',{n:n(c.offices.length)}); }

function readiness(){
  var heads = P.team.filter(function(m){ return m.d==='HEAD'; }).length, officers = P.team.filter(function(m){ return m.d==='OFFICER'; }).length;
  var active = P.codes.filter(function(c){ return c.status==='ACTIVE'; });
  var items = [
    {label:t('r_head'), done:heads===1, action:can('team')?{label:t('assign'), go:'team'}:null},
    {label:t('r_officer'), done:officers>=1, action:can('team')?{label:t('assign'), go:'team'}:null},
    {label:t('r_active'), done:active.length>0, action:null}
  ];
  if(P.rules.docs){
    var withDoc = active.filter(function(c){ return c.docs.length>0; }).length;
    items.push({label:t('r_orders'), value:n(withDoc)+' / '+n(active.length), done:active.length>0 && withDoc===active.length, action:null});
  }
  return items;
}
function todos(){
  var list = [];
  var heads = P.team.filter(function(m){ return m.d==='HEAD'; }).length, officers = P.team.filter(function(m){ return m.d==='OFFICER'; }).length;
  if(!heads) list.push({tone:'danger', icon:'fa-user-plus', title:t('todoTeam',{r:t('role_HEAD').toLowerCase()}), why:t('todoTeamWhy'), who:t('whoHead'), act:can('team')?{label:t('assign'), go:'team'}:null});
  if(!officers) list.push({tone:'danger', icon:'fa-user-plus', title:t('todoTeam',{r:t('role_OFFICER').toLowerCase()}), why:t('todoTeamWhy'), who:t('whoHead'), act:can('team')?{label:t('assign'), go:'team'}:null});
  var noOrder = P.codes.filter(function(c){ return c.status==='ACTIVE' && P.rules.docs && !c.docs.length; });
  if(noOrder.length>2) list.push({tone:'warning', icon:'fa-file-pdf', title:t('todoOrderMany',{n:n(noOrder.length)}), why:t('todoOrderManyWhy'), who:t('whoEditors'), act:writer()?{label:t('showCodes'), go:'setup'}:null});
  else noOrder.forEach(function(c){ list.push({tone:'warning', icon:'fa-file-pdf', title:t('todoOrder',{c:short(c)}), why:t('todoOrderWhy'), who:t('whoEditors'), act:can('docs')?{label:t('attach'), cmd:'attach', id:c.id}:null}); });
  P.codes.filter(function(c){ return c.status==='DRAFT'; }).forEach(function(c){
    var m = missing(c);
    if(!m.length) list.push({tone:'info', icon:'fa-circle-play', title:t('todoReady',{c:short(c)}), why:t('todoReadyWhy'), who:t('whoHead'), act:can('activate')?{label:t('activate'), cmd:'activate', id:c.id, tone:'success'}:null});
    else list.push({tone:'info', icon:'fa-pen', title:t('todoFinish',{c:short(c)}), why:t('todoFinishWhy',{m:m.map(function(x){ return t('m_'+x.key); }).join(', ')}), who:t('whoEditors'), act:can('edit')?{label:t('edit'), cmd:'edit', id:c.id}:null});
  });
  return list;
}

  return '<div class="gs-action-row'+(why?' gs-action-row--unavailable':'')+'" id="mg-ar-'+id+'"><div class="gs-action-row__text"><strong class="gs-action-row__title">'+esc(title)+'</strong><p class="gs-action-row__description">'+esc(desc)+'</p>'+
