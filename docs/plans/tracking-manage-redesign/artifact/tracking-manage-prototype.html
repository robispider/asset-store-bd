        & .table-striped > tbody > tr:nth-of-type(even) {
            background-color: var(--gs-color-surface) !important;
            border-top: var(--gs-border-width) solid var(--gs-table-border) !important;
            color: var(--gs-color-text) !important;
        }
        & .table-hover > tbody > tr:hover,
        & .table-hover > tbody > tr:hover > td,
        & .bootstrap-table .fixed-table-container .table tbody tr:hover td {
            background-color: var(--gs-table-row-hover) !important;
        }
        & .bootstrap-table .fixed-table-container .table tbody tr.selected td {
            background-color: var(--gs-table-row-selected) !important;
        }
        & tr.success > td { background-color: var(--gs-color-success) !important; color: var(--gs-color-on-success) !important; }
        & tr.danger > td { background-color: var(--gs-color-danger) !important; color: var(--gs-color-on-danger) !important; }
        & tr.warning > td { background-color: var(--gs-color-warning-subtle) !important; }
        & .table-bordered,
        & .table-bordered > thead > tr > th,
        & .table-bordered > tbody > tr > td,
        & .table-bordered > tbody > tr > th,
        & .table-bordered > tfoot > tr > td {
            border-color: var(--gs-table-border) !important;
        }
        & .bootstrap-table .fixed-table-container,
        & .fixed-table-loading,
        & .bootstrap-table .fixed-table-toolbar .columns .dropdown-menu {
            background-color: var(--gs-color-surface) !important;
            border-color: var(--gs-table-border) !important;
            color: var(--gs-color-text) !important;
        }
        & .bootstrap-table .fixed-table-toolbar li.dropdown-item-marker label { color: var(--gs-color-text) !important; }
        & .bootstrap-table .fixed-table-toolbar li.dropdown-item-marker label:hover { background-color: var(--gs-color-primary-subtle) !important; color: var(--gs-color-text) !important; }

        /* ---------- pagination ---------- */
        & .pagination > li > a,
        & .pagination > li > span {
            background-color: var(--gs-color-surface) !important;
            border-color: var(--gs-color-border) !important;
            color: var(--gs-color-link) !important;
        }
        & .pagination > li > a:hover,
        & .pagination > li > a:focus {

            color: var(--gs-color-link-hover) !important;
        }
        & .pagination > .active > a,
        & .pagination > .active > a:hover,
        & .pagination > li > .active > a,
        & .page-item.active,
        & .page-next a {
            background-color: var(--gs-color-primary) !important;
            border-color: var(--gs-color-primary) !important;
            color: var(--gs-color-on-primary) !important;
        }

        /* ---------- forms ---------- */
        & input[type="date"], & input[type="number"], & input[type="text"], & input[type="url"],
        & input[type="email"], & input[type="password"], & input[type="tel"], & input[type="search"],
        & select, & textarea, & .form-control,
        & .select2-selection, & .select2-selection--single, & .select2-selection--multiple,
        & .select2-search__field, & .select2-selection__rendered {
            background-color: var(--gs-color-surface) !important;
            color: var(--gs-color-text) !important;
            border-color: var(--gs-color-border-strong) !important;
            border-radius: var(--gs-radius-sm) !important;
        }
        & .form-control, & .select2-container .select2-selection--single { min-height: var(--gs-size-control-h) !important; }
        & input:focus, & select:focus, & textarea:focus, & .form-control:focus,
        & .select2-container--focus .select2-selection {
            border-color: var(--gs-color-focus-ring) !important;
            box-shadow: 0 0 0 3px var(--gs-color-primary-subtle) !important;
        }
        & input:required, & select:required, & textarea:required {

        }
        & input:disabled, & input[readonly], & textarea[readonly], & textarea:disabled, & select:disabled,
        & .select2-container--disabled .select2-selection {
            background-color: var(--gs-color-surface-sunken) !important;
            color: var(--gs-color-text-muted) !important;
        }
        & ::placeholder { color: var(--gs-color-text-subtle) !important; opacity: 1 !important; }
        & :is(label, .control-label):not([class*="gs-"]) { color: var(--gs-color-text) !important; }
        & .help-block, & .form-text { color: var(--gs-color-text-muted) !important; }
        & .has-error .form-control, & .has-error .select2-selection { border-color: var(--gs-color-danger) !important; }
        & .has-error, & .has-error .help-block, & .alert-msg, & .has-error .control-label { color: var(--gs-color-danger) !important; }
        & .input-group-addon {
            background-color: var(--gs-color-surface-sunken) !important;
            color: var(--gs-color-text-muted) !important;
            border-color: var(--gs-color-border-strong) !important;
        }
        & input[type="radio"]::before,
        & input[type="checkbox"]::before { box-shadow: inset 1em 1em var(--gs-color-primary) !important; }
        & [data-theme="dark"] select[multiple],
        &[data-theme="dark"] select[multiple],
        &[data-theme="dark"] select[multiple] option {
            background-color: var(--gs-color-surface) !important;
            color: var(--gs-color-text) !important;
        }
        & legend { color: var(--gs-color-text) !important; border-bottom-color: var(--gs-color-border) !important; }

        /* ---------- select2 dropdown ---------- */
        & .select2-dropdown,
        & .select2-results__option,
        & .select2-results__option[aria-selected=false] {
            background-color: var(--gs-color-surface-raised) !important;
            color: var(--gs-color-text) !important;
            border-color: var(--gs-color-border) !important;
        }
        & .select2-results__option--highlighted[aria-selected],
        & .select2-results__option--highlighted[aria-selected=false],
        & .select2-results__option--highlighted[aria-selected=true] {

            color: var(--gs-color-text) !important;
        }
        & .select2-results__option[aria-selected=true] {
            background-color: var(--gs-color-primary) !important;
            color: var(--gs-color-on-primary) !important;
        }
        & .select2-selection__choice,
        & .select2-container--default .select2-selection--multiple .select2-selection__choice {
            background-color: var(--gs-color-primary-subtle) !important;
            border-color: var(--gs-color-primary) !important;
            color: var(--gs-color-text) !important;
        }
        & .select2-selection__choice__remove { color: var(--gs-color-text-muted) !important; }

        /* ---------- datepicker ---------- */
        & .datepicker.dropdown-menu,
        & .datepicker.dropdown-menu th, & .datepicker.dropdown-menu td,
        & .datepicker.datepicker-inline th, & .datepicker.datepicker-inline td {
            background-color: var(--gs-color-surface-raised) !important;
            color: var(--gs-color-text) !important;
            border-color: transparent !important;
        }
        & .datepicker.dropdown-menu th:hover, & .datepicker.dropdown-menu td:hover,
        & .datepicker table tr td span:hover, & .datepicker table tr td span.focused {
            background-color: var(--gs-color-primary-subtle) !important;
            color: var(--gs-color-text) !important;
        }
        & .datepicker table tr td.active, & .datepicker table tr td.active:hover,
        & .datepicker table tr td span.active {
            background: var(--gs-color-primary) !important;

        }
        & .datepicker table tr td.old, & .datepicker table tr td.new { color: var(--gs-color-text-subtle) !important; }

        /* ---------- buttons ---------- */
        & .btn { border-radius: var(--gs-radius-sm) !important; font-family: inherit !important; }
        & .btn-primary, & .btn-theme, & .btn-primary:focus, & .btn-theme:focus {
            background-color: var(--gs-color-primary) !important;
            border: var(--gs-border-width) solid var(--gs-color-primary-active) !important;
            color: var(--gs-color-on-primary) !important;
        }
        & .btn-primary:hover, & .btn-theme:hover, & .btn-theme.active, & .btn-primary.active {
            background-color: var(--gs-color-primary-hover) !important;
            color: var(--gs-color-on-primary) !important;
        }
        & .btn-success, & .btn-success:hover, & .btn-success:focus {
            background-color: var(--gs-color-success) !important; border-color: var(--gs-color-success) !important; color: var(--gs-color-on-success) !important;
        }
        & .btn-warning, & .btn-warning:hover, & .btn-warning:focus {
            background-color: var(--gs-color-warning) !important; border-color: var(--gs-color-warning) !important; color: var(--gs-color-on-warning) !important;
        }
        & .btn-danger, & .btn-danger:hover, & .btn-danger:focus {
            background-color: var(--gs-color-danger) !important; border-color: var(--gs-color-danger) !important; color: var(--gs-color-on-danger) !important;
        }
        & .btn-info, & .btn-info:hover, & .btn-info:focus {
            background-color: var(--gs-color-info) !important; border-color: var(--gs-color-info) !important; color: var(--gs-color-on-info) !important;
        }
        & .btn-default, & .btn-default:hover, & .btn-default:focus, & .btn-tableButton {
            background-color: var(--gs-color-surface) !important;
            border-color: var(--gs-color-border-strong) !important;
            color: var(--gs-color-text) !important;

        & .btn-selected, & .btn-selected a, & .btn-selected:hover, & .btn-selected:focus,

            color: var(--gs-color-text) !important;
        }
        & .btn-link { color: var(--gs-color-link) !important; }

        /* ---------- labels & badges ---------- */
        & .label { border-radius: var(--gs-radius-sm) !important; }
        & .label-default, & .label-default:hover { background-color: var(--gs-color-surface-sunken) !important; color: var(--gs-color-text) !important; }
        & .label-primary { background-color: var(--gs-color-primary) !important; color: var(--gs-color-on-primary) !important; }
        & .label-success { background-color: var(--gs-color-success) !important; color: var(--gs-color-on-success) !important; }
        & .label-warning { background-color: var(--gs-color-warning) !important; color: var(--gs-color-on-warning) !important; }
        & .label-danger { background-color: var(--gs-color-danger) !important; color: var(--gs-color-on-danger) !important; }
        & .label-info { background-color: var(--gs-color-info) !important; color: var(--gs-color-on-info) !important; }
        & .badge { background-color: var(--gs-color-text-muted) !important; color: var(--gs-color-surface) !important; }
        & .label-light { background-color: var(--gs-color-surface-sunken) !important; color: var(--gs-color-text) !important; }
        & a.label-light, & a.label-light:hover { color: var(--gs-color-link) !important; }

        /* ---------- text helpers ---------- */
        & .text-primary { color: var(--gs-color-primary) !important; }
        & .text-success { color: var(--gs-color-success) !important; }
        & .text-warning { color: var(--gs-color-warning) !important; }
        & .text-danger { color: var(--gs-color-danger) !important; }
        & .text-info { color: var(--gs-color-info) !important; }
        & .text-muted { color: var(--gs-color-text-muted) !important; }
        & .text-dark-gray a:link, & .text-dark-gray a:visited { color: var(--gs-color-link) !important; }

        /* ---------- alerts & callouts ---------- */
        & .alert { border-radius: var(--gs-radius-md) !important; border-width: var(--gs-border-width) !important; }
        & .alert a { color: inherit !important; text-decoration: underline !important; }
        & .alert-success { background-color: var(--gs-color-success-subtle) !important; border-color: var(--gs-color-success) !important; color: var(--gs-color-text) !important; }
        & .alert-warning { background-color: var(--gs-color-warning-subtle) !important; border-color: var(--gs-color-warning) !important; color: var(--gs-color-text) !important; }
        & .alert-danger, & .alert-error { background-color: var(--gs-color-danger-subtle) !important; border-color: var(--gs-color-danger) !important; color: var(--gs-color-text) !important; }
        & .alert-info { background-color: var(--gs-color-info-subtle) !important; border-color: var(--gs-color-info) !important; color: var(--gs-color-text) !important; }
        & .alert .close { color: var(--gs-color-text) !important; }
        & .callout { border-left-width: 4px !important; color: var(--gs-color-text) !important; border-radius: var(--gs-radius-sm) !important; }
        & .callout.callout-legend { background-color: var(--gs-color-surface-sunken) !important; border-left-color: var(--gs-color-border-strong) !important; }
        & .callout.callout-info { background-color: var(--gs-color-info-subtle) !important; border-left-color: var(--gs-color-info) !important; }
        & .callout.callout-success { background-color: var(--gs-color-success-subtle) !important; border-left-color: var(--gs-color-success) !important; }
        & .callout.callout-warning { background-color: var(--gs-color-warning-subtle) !important; border-left-color: var(--gs-color-warning) !important; }
        & .callout.callout-danger { background-color: var(--gs-color-danger-subtle) !important; border-left-color: var(--gs-color-danger) !important; }
        & .callout h4, & .callout p, & .callout-legend h4 a, & p.callout-subtext { color: var(--gs-color-text) !important; }

        /* ---------- tabs ---------- */
        & .nav-tabs-custom > .nav-tabs { border-bottom: var(--gs-border-width) solid var(--gs-color-border) !important; }
        & .nav-tabs-custom > .nav-tabs > li,
        & .nav-tabs-custom > .nav-tabs > li > a { background: transparent !important; color: var(--gs-color-text-muted) !important; border-color: transparent !important; }
        & .nav-tabs-custom > .nav-tabs > li.active,
        & .nav-tabs-custom > .nav-tabs > li.active > a,
        & .nav-tabs-custom > .nav-tabs > li.active > a:link,
        & .nav-tabs-custom > .nav-tabs > li.active > a:hover {
            background-color: var(--gs-color-surface) !important;
            color: var(--gs-color-text) !important;
            border-top: 0 !important;
            border-bottom: 2px solid var(--gs-color-primary) !important;
        }
        & .nav-tabs > li > a:hover { background-color: var(--gs-color-surface-sunken) !important; }
        & .nav-pills > li.active > a { background-color: var(--gs-color-primary) !important; color: var(--gs-color-on-primary) !important; }

        /* ---------- modals, popovers, tooltips ---------- */
        & .modal-content,
        & .modal-header,
        & .modal-footer {
            background-color: var(--gs-color-surface-raised) !important;
            color: var(--gs-color-text) !important;
