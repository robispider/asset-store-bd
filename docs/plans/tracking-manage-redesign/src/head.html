<meta name="claude:viewport-fit-sides" content="cover">
<script>
(function(){
  var root=document.documentElement, skin='civic-ledger', lang='en';
  try{ skin=localStorage.getItem('mg-skin')||skin; lang=localStorage.getItem('mg-lang')||lang; }catch(e){}
  root.setAttribute('data-skin',skin); root.setAttribute('lang',lang==='bn'?'bn':'en');
  if(!root.getAttribute('data-theme')){
    var dark=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme',dark?'dark':'light');
  }
})();
</script>
